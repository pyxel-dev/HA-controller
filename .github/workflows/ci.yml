name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r .github/scripts/requirements.txt
      - run: ruff check .github/scripts
      - run: pytest .github/scripts/tests
