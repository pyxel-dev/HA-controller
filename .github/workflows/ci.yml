name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r .github/scripts/requirements.txt
      - run: ruff check .github/scripts
      - run: pytest .github/scripts/tests

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r custom_components/requirements_test.txt
      - run: ruff check custom_components
      - run: pytest custom_components/ha_controller/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_components/ha_controller/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: custom_components/ha_controller/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
