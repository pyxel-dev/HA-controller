lvgl:
  displays: [amoled]
  touchscreens: [touch]
  buffer_size: 25%
  bg_color: 0x000000
  pages:
    - id: boot_page
      widgets:
        - label:
            align: center
            y: -40
            text: HA Controller
            text_font: font_m
            text_color: 0xFFFFFF
        - label:
            align: center
            y: 10
            text: v${project_version}
            text_font: font_s
            text_color: 0x9CA3AF
        - label:
            align: center
            y: 70
            text: "💡"
            text_font: emoji_m
            text_color: 0xFFFFFF
        - arc:
            id: keep_arc
            hidden: true
        - slider:
            id: keep_slider
            hidden: true

ha_controller:
  id: ui
  size: 466
  edge_width: 36
  text_fonts: {s: font_s, m: font_m, l: font_l, xl: font_xl}
  value_fonts: {s: value_s, m: value_m, l: value_l, xl: value_xl}
  emoji_fonts: {s: emoji_s, m: emoji_m, l: emoji_l, xl: emoji_xl}
  battery_level: battery_level
  battery_charging: battery_charging
  screen_brightness: screen_brightness
  touchscreen: touch
  on_sleep:
    - script.execute: screen_off
    - lvgl.pause
  on_wake:
    - lvgl.resume
    - lvgl.widget.redraw
    - script.execute: screen_on
  on_control:
    - homeassistant.event:
        event: esphome.ha_controller_control
        data:
          block: !lambda 'return block;'
          item: !lambda 'return item;'
          op: !lambda 'return op;'
          value: !lambda 'return str_sprintf("%.2f", value);'

api:
  on_client_connected:
    - delay: 5s
    - script.execute:
        id: send_hello
        reason: connected
  actions:
    - action: set_layout
      variables:
        layout: string
      then:
        - lambda: id(ui).set_layout(layout);
        - script.execute:
            id: send_hello
            reason: applied
    - action: set_states
      variables:
        states: string
      then:
        - lambda: id(ui).set_states(states);

script:
  - id: send_hello
    mode: queued
    parameters:
      reason: string
    then:
      - homeassistant.event:
          event: esphome.ha_controller_hello
          data:
            node: !lambda 'return App.get_name();'
            version: ${project_version}
            protocol: "1"
            revision: !lambda 'return id(ui).get_revision();'
            reason: !lambda 'return reason;'

interval:
  - interval: 60s
    then:
      - if:
          condition:
            api.connected:
          then:
            - script.execute:
                id: send_hello
                reason: heartbeat
